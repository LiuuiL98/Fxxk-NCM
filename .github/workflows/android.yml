name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Generate complete PNG launcher icon
        run: |
          python3 -m pip install --user --quiet pillow
          python3 .github/scripts/generate_launcher_icon.py
      - name: Run unit tests and build APKs
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleRelease
      - name: Report APK sizes
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Fxxk-NCM-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload optimized release APK
        uses: actions/upload-artifact@v4
        with:
          name: Fxxk-NCM-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
