name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run unit tests and build APKs
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleRelease
      - name: Sign diagnostic Release APK with Android apksigner
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          APKSIGNER="$SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner"
          ZIPALIGN="$SDK_ROOT/build-tools/$BUILD_TOOLS/zipalign"
          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"
          INPUT_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="app/build/outputs/apk/release/app-release-aligned.apk"
          OUTPUT_APK="app/build/outputs/apk/release/Fxxk-NCM-0.2.1-release-debug-signed.apk"

          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          test -f "$DEBUG_KEYSTORE"
          test -f "$INPUT_APK"

          "$ZIPALIGN" -p -f 4 "$INPUT_APK" "$ALIGNED_APK"
          "$APKSIGNER" sign \
            --ks "$DEBUG_KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUTPUT_APK" \
            "$ALIGNED_APK"

          "$APKSIGNER" verify --verbose --print-certs "$OUTPUT_APK"
          "$ZIPALIGN" -c -v 4 "$OUTPUT_APK"
          sha256sum "$OUTPUT_APK"
          ls -lh "$OUTPUT_APK"
      - name: Report APK sizes
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Fxxk-NCM-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload optimized release APK
        uses: actions/upload-artifact@v4
        with:
          name: Fxxk-NCM-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Upload diagnostic signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Fxxk-NCM-release-debug-signed-diagnostic
          path: app/build/outputs/apk/release/Fxxk-NCM-0.2.1-release-debug-signed.apk
          if-no-files-found: error
